<span class="pending-frame__icon" aria-hidden="true">
  @if (kind() === 'video') {
    <svg viewBox="0 0 24 24" width="28" height="28">
      <path d="M8 5.5v13l10.5-6.5z" fill="currentColor" />
    </svg>
  } @else {
    <svg
      viewBox="0 0 24 24"
      width="28"
      height="28"
      fill="none"
      stroke="currentColor"
      stroke-width="1.2"
    >
      <rect x="3.5" y="5.5" width="17" height="13" rx="1" />
      <path d="M3.5 15.5l5-4.5 4 3.5 2.5-2 5 4" />
    </svg>
  }
</span>
<p class="pending-frame__label">{{ label() }}</p>
@if (path()) {
  <p class="pending-frame__path">
    Archivo esperado: <code>{{ path() }}</code>
  </p>
}
